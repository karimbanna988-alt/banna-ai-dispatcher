<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LUXOR Dispatch</title>

<!-- Phone/PWA. Installable only over HTTPS (or localhost); over plain
     LAN http these are inert but harmless -- see docs/PHONE_DISPATCH_PILOT.md -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B0E14">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LUXOR">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">

<link rel="stylesheet" href="css/console.css?v=2">
</head>
<body>

<div id="loginScreen" class="login">
  <div class="login-card">
    <div class="login-brand">LUXOR<span>DISPATCH</span></div>
    <div class="login-sub">Operator console</div>
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="app" class="app" hidden>

  <header class="topbar">
    <div class="brand">LUXOR<span>DISPATCH</span></div>

    <div class="counts">
      <button class="count" data-jump="dispatch">
        <span class="count-n" id="countDispatch">0</span><span class="count-l">To dispatch</span>
      </button>
      <button class="count" data-jump="progress">
        <span class="count-n" id="countProgress">0</span><span class="count-l">In progress</span>
      </button>
      <button class="count" data-jump="close">
        <span class="count-n" id="countClose">0</span><span class="count-l">To close</span>
      </button>
    </div>

    <div class="topbar-right">
      <input type="search" id="searchInput" class="search" placeholder="Search ticket, tech, city  ( / )" autocomplete="off">
      <div class="health" id="health" title="Service health">
        <span class="dot" id="dotCrm"></span><span class="dot-l">CRM</span>
        <span class="dot" id="dotAdapter"></span><span class="dot-l">ADP</span>
        <span class="dot" id="dotWa"></span><span class="dot-l">WA</span>
      </div>
    </div>
  </header>

  <!-- Connectivity truth. Never let cached pixels read as live work. -->
  <div id="offlineBar" class="offline-bar" hidden>
    <b>OFFLINE</b> <span id="offlineDetail">not live &middot; showing last known state</span>
  </div>

  <!-- Phone stage switcher. One tap per stage; only one stage occupies
       the phone viewport at a time. Hidden on desktop, where all three
       columns are visible at once. -->
  <nav class="stages" id="stages">
    <button class="stage on" data-stage="dispatch">
      <span class="stage-l">To dispatch</span><span class="stage-n" id="stDispatch">0</span>
    </button>
    <button class="stage" data-stage="progress">
      <span class="stage-l">In progress</span><span class="stage-n" id="stProgress">0</span>
    </button>
    <button class="stage" data-stage="close">
      <span class="stage-l">To close</span><span class="stage-n" id="stClose">0</span>
    </button>
  </nav>

  <div id="searchResults" class="search-results" hidden></div>

  <section class="demo-strip" id="demoStrip" hidden>
    <div class="demo-head">
      <span class="demo-tag">DEMO</span>
      <span id="demoState" class="demo-state"></span>
      <span class="demo-note">isolated &middot; no production job is created</span>
    </div>
    <div class="demo-steps" id="demoSteps"></div>
  </section>

  <main class="board" id="board" data-stage="dispatch">
    <section class="col" id="colDispatch" data-col="dispatch">
      <div class="col-head"><h2>To dispatch</h2><span class="col-count" id="hdDispatch">0</span></div>
      <div class="col-body" id="listDispatch"></div>
    </section>

    <section class="col" id="colProgress" data-col="progress">
      <div class="col-head"><h2>In progress</h2><span class="col-count" id="hdProgress">0</span></div>
      <div class="col-body" id="listProgress"></div>
    </section>

    <section class="col" id="colClose" data-col="close">
      <div class="col-head"><h2>To close</h2><span class="col-count" id="hdClose">0</span></div>
      <div class="col-body" id="listClose"></div>
    </section>
  </main>

  <aside class="detail" id="detail" hidden>
    <div class="detail-head">
      <div id="detailTitle" class="detail-title"></div>
      <button class="icon-btn" id="detailClose" title="Close (Esc)">&times;</button>
    </div>
    <div class="detail-body" id="detailBody"></div>
    <!-- Thumb-reachable primary action. Populated per job type; empty
         when the job offers no safe one-tap action. -->
    <div class="detail-bar" id="detailBar" hidden></div>
  </aside>

  <footer class="statusbar">
    <button class="admin-btn" id="adminBtn" title="Back office">&#9881; Admin</button>
    <span class="hint">J/K move &middot; Enter open &middot; C copy &middot; Esc close</span>
    <span class="spacer"></span>
    <span class="stale" id="staleNote"></span>
    <span class="updated" id="updatedAt"></span>
  </footer>

  <div class="toast" id="toast" hidden></div>
</div>

<script src="js/api.js?v=2"></script>
<script src="js/console.js?v=2"></script>
</body>
</html>
