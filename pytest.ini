[pytest]
# The suite is tests/. Nothing else in this working tree is a test source.
#
# Why this file exists: the owner keeps exported handoff bundles and
# review copies at the top level (Exports/, *_REVIEW_BUNDLE/). Those
# contain a full COPY of tests/ with identical module basenames, so a
# bare `pytest` collected both and aborted the entire run with 56
# "import file mismatch" collection errors -- before executing a single
# test. Scoping collection makes `pytest` mean one unambiguous thing
# without deleting or moving anything the owner put there.
#
# This narrows WHERE tests are found. It does not skip, deselect or
# weaken any test, and the root conftest.py (including the production
# database tripwire) still applies to every run.
testpaths = tests

norecursedirs =
    Exports
    ENGINEERING_REVIEW_BUNDLE
    AI_DISPATCHER_ENGINEERING_REVIEW_BUNDLE
    node_modules
    .git
    __pycache__
    whatsapp_shadow_bridge/node_modules
