# Augusta coverage, not Columbia or Charleston coverage.
- city: Augusta
  state: GA
  area: Augusta
- city: Evans
  state: GA
  area: Augusta
- city: Martinez
  state: GA
  area: Augusta
- city: Grovetown
  state: GA
  area: Augusta
- city: Aiken
  state: SC
  area: Augusta
- city: North Augusta
  state: SC
  area: Augusta
