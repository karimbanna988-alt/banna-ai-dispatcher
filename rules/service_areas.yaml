# Permanent service-area mapping (business rules, not code).
#
# 2026-07-28: this file holds ONLY geographic/business facts -- city/state,
# active flag, recurring day off, default technician availability, vehicle/
# company restrictions. It intentionally does NOT hold dispatch_group or
# closing_group values anymore. Those are opaque WhatsApp destination
# strings that belong to individual technicians (configured per technician
# in the app's "Technicians" tab / storage.py's technicians table), not to
# an area -- a single area can have several technicians, each with their
# own dispatch/closing group, and the system must never guess which one
# applies from the wording of a group name. See docs/architecture.md
# section 10.
#
# Business model confirmed by the business owner (2026-07-27):
# - Every area is active by default, permanently. There is no daily
#   "state open/closed" message in real operation.
# - default_technician_availability is "available" for every area for now
#   (explicitly authorized as a temporary testing default on 2026-07-26/27)
#   -- this will be replaced by a real technician-availability workflow
#   later. It is NOT a claim that a specific technician is confirmed
#   available; it's a placeholder so decisions can proceed during initial
#   testing instead of blocking on a workflow that doesn't exist yet.
# - Some areas have a RECURRING weekly day off (recurring_day_off), e.g.
#   Chicago is off every Saturday. This is different from a daily message --
#   it's a standing weekly pattern, stored here so it doesn't need to be
#   re-entered every day. Only Chicago and Raleigh, NC are confirmed so far;
#   the business owner will provide the rest of the schedule later. Leave
#   recurring_day_off null for every area not yet confirmed -- never guess.
# - recurring_day_off_action controls whether hitting that day resolves to
#   PASS (a known, confirmed non-coverage day -- treated like any other
#   confirmed exclusion) or HANDLE_MANUALLY (still ask a human every time).
#   Defaults to PASS; change per-area if the owner wants otherwise.
#
# state is left null wherever the business owner gave only a bare city name
# (several of these city names are ambiguous across multiple US states --
# e.g. Arlington, Augusta, Columbia, Greenville, Chicago, Vancouver -- and
# guessing the wrong one would risk misrouting a job). Only "Charlotte, NC"
# and "Raleigh, NC" were given with an explicit state. Fill in state once
# confirmed; until then, matching falls back to city-name-only (see
# rules/service_areas.py).
#
# To add a new area: append another entry below. No code changes needed.

